<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Quiz</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">10 levels. 10 questions each.</p>
      <h1 id="page-title">India Quiz</h1>

      <div id="levels-view">
        <p class="intro">Answer all 10 questions correctly to unlock the next level. You get 20 seconds per question, and faster answers make later levels easier to reach.</p>
        <div id="level-grid" class="level-grid"></div>
        <p id="load-error" class="error" role="alert" hidden></p>
        <button id="reset-button" class="ghost" type="button">Reset progress</button>
      </div>

      <div id="quiz-view" hidden>
        <div class="quiz-top"><span id="level-label"></span><span id="count-label"></span><span id="timer-label"></span></div>
        <div class="bar"><div id="timer-bar"></div></div>
        <h2 id="question"></h2>
        <div id="options" class="options"></div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </div>

      <div id="result-view" class="result" hidden>
        <h2 id="result-title"></h2>
        <p id="result-text" class="intro"></p>
        <button id="result-primary" type="button"></button>
        <button id="result-menu" class="ghost" type="button">All levels</button>
      </div>
    </section>
  </main>
  <canvas id="confetti" aria-hidden="true"></canvas>
</body>
</html>
